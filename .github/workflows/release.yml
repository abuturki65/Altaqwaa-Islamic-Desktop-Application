name: بناء الإصدار ورفع الحزم

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # Linux: AppImage · deb · rpm · tar.gz
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت المكتبات
        run: npm ci

      - name: بناء الواجهة (Vite)
        run: npm run build

      - name: بناء حزم Linux
        run: npx electron-builder --linux AppImage deb rpm tar.gz

      - name: رفع الحزم
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/latest-linux.yml
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Windows: NSIS installer · portable
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت المكتبات
        run: npm ci

      - name: بناء الواجهة (Vite)
        run: npm run build

      - name: بناء حزم Windows
        run: npx electron-builder --windows nsis portable

      - name: رفع الحزم
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # macOS: dmg
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت المكتبات
        run: npm ci

      - name: بناء الواجهة (Vite)
        run: npm run build

      - name: بناء حزمة macOS
        run: npx electron-builder --mac dmg

      - name: رفع الحزمة
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # إنشاء الإصدار ورفع كل الحزم
  # ──────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: تحميل الحزم Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: artifacts

      - name: تحميل الحزم Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: artifacts

      - name: تحميل حزمة macOS
        uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: artifacts

      - name: عرض الحزم
        run: ls -lh artifacts/

      - name: إنشاء الإصدار
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          draft: false
          prerelease: false
