<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: altaqwaa:; media-src 'self' https: http: blob: altaqwaa:; font-src 'self' data: altaqwaa:; connect-src 'self' https: http: ws: wss: altaqwaa:; object-src 'none'; base-uri 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>التقوى</title>
    <style>
        /* Boot splash — painted before the app bundle loads. The preload
           sets data-theme first, so this always matches the saved theme. */
        #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0c1117;
            transition: opacity .5s ease, visibility .5s ease;
        }
        [data-theme="light"] #boot-splash { background: #f6f4ee; }
        #boot-splash.boot-done { opacity: 0; visibility: hidden; pointer-events: none; }

        .boot-splash-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            animation: boot-rise .55s cubic-bezier(.2, .8, .2, 1) both;
        }
        .boot-logo {
            width: 88px;
            height: 88px;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            animation: boot-pulse 1.6s ease-in-out infinite;
        }
        .boot-name {
            font-family: "Vazirmatn", system-ui, sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: .5px;
            color: #e8edf3;
        }
        [data-theme="light"] .boot-name { color: #1f272e; }
        .boot-loader {
            margin-top: 4px;
            width: 132px;
            height: 3px;
            border-radius: 999px;
            background: rgba(232, 237, 243, .12);
            overflow: hidden;
        }
        [data-theme="light"] .boot-loader { background: rgba(31, 39, 46, .1); }
        .boot-loader span {
            display: block;
            height: 100%;
            width: 40%;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, #2dd4bf, #d6b25c, transparent);
            animation: boot-slide 1.1s ease-in-out infinite;
        }
        @keyframes boot-rise {
            from { opacity: 0; transform: translateY(10px) scale(.97); }
            to { opacity: 1; transform: none; }
        }
        @keyframes boot-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.04); opacity: .9; }
        }
        @keyframes boot-slide {
            from { transform: translateX(-110%); }
            to { transform: translateX(260%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .boot-splash-inner, .boot-logo, .boot-loader span { animation: none; }
        }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash-inner">
        <img class="boot-logo" src="/logo.png" alt="" draggable="false" />
        <div class="boot-name">التقوى</div>
        <div class="boot-loader"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
